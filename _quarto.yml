project:
  type: website

website:
  favicon: favicon.ico
  site-url: "https://migue-rc.github.io/EDA_dogs"
  description: "Why the friendliest dog breeds rack up the most reported bites - an exploratory analysis about base rates."
  open-graph: true
  twitter-card: true
  image: "assets/hero.jpg"
  # Creates a top navbar so users can always get back to your Hub
  navbar:
    left:
      - text: "← Back to Main"
        href: "https://migue-rc.github.io"

# Engine configuration (Moved out of format block)
execute:
  warning: false # Hides Python deprecation/info warnings in the final output

format:
  html:
    # Loads the base theme, then any local SCSS variables
    theme:
      light: [sketchy, sketchy-light.scss, custom.scss]
      dark: [sketchy, sketchy-dark.scss, custom.scss]
    # Injects your live, remote CSS file for instant global updates
    highlight-style: 
      light: github
      dark: monokai
    include-in-header: 
      text: |
        <link rel="stylesheet" href="https://migue-rc.github.io/brand-theme.css">
    css: local-style.css
    toc: true
    code-fold: true
